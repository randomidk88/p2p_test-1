<!DOCTYPE html>
<html>
<head>
    <title>P2P Private Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* Layout Setup */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
            background-color: #222222; /* Dark Background */
            color: #dddddd;            /* Global Text Color */
        }

        h2 { 
            color: #00bbff;           /* Heading color (Blue) */
            margin-top: 0;
        }

        #status, #my-id { 
            color: #aaaaaa;           /* Subtext color (Grey) */
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        /* Chat Window */
        #messages { 
            flex-grow: 1; 
            border: 1px solid #444; 
            overflow-y: auto; 
            margin-bottom: 10px; 
            padding: 10px; 
            background-color: #1a1a1a; 
        }

        /* Individual Messages */
        p { 
            color: #ffffff;           /* Message Text (White) */
            margin: 5px 0; 
            padding: 5px;
            border-bottom: 1px solid #333;
        }

        /* Controls & Inputs */
        #controls { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
        }

        input { 
            background: #333; 
            border: 1px solid #555; 
            color: white; 
            padding: 10px; 
            flex-grow: 1;
            border-radius: 4px;
        }

        button { 
            background: #00bbff; 
            border: none; 
            color: white; 
            padding: 10px 20px; 
            cursor: pointer; 
            font-weight: bold;
            border-radius: 4px;
        }

        button:hover {
            background: #0088cc;
        }
    </style>
</head>
<body>

    <h2>P2P Private Chat</h2>
    <div id="status">Status: Initializing...</div>
    <div id="my-id">My ID: ...</div>
    
    <div id="messages"></div>

    <div id="controls">
        <input type="text" id="peer-id-input" placeholder="Enter Friend's ID">
        <button onclick="connectToPeer()">Connect</button>
        <div style="width: 100%; height: 0;"></div> <input type="text" id="message-input" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const status = document.getElementById('status');
        const myIdDisplay = document.getElementById('my-id');
        const messageInput = document.getElementById('message-input');
        const messagesDiv = document.getElementById('messages');
        let peer, conn;

        // 1. Initialize Peer
        // To use your specific code 373927 automatically, 
        // one person can change this to: peer = new Peer('373927');
        peer = new Peer(); 

        peer.on('open', (id) => {
            myIdDisplay.innerText = "Your ID: " + id;
            status.innerText = "Status: Online. Waiting for connection...";
        });

        // 2. Listen for incoming connections
        peer.on('connection', (connection) => {
            conn = connection;
            setupChat();
        });

        // 3. Connect to a friend
        function connectToPeer() {
            const peerId = document.getElementById('peer-id-input').value;
            if (!peerId) return alert("Enter an ID first!");
            conn = peer.connect(peerId);
            setupChat();
        }

        function setupChat() {
            status.innerText = "Status: Connected!";
            conn.on('data', (data) => {
                displayMessage("Friend: " + data);
            });
            conn.on('open', () => {
                displayMessage("--- System: Connection Established ---");
            });
        }

        function sendMessage() {
            const msg = messageInput.value;
            if (!msg || !conn) return;
            conn.send(msg);
            displayMessage("Me: " + msg);
            messageInput.value = "";
        }

        function displayMessage(msg) {
            const p = document.createElement('p');
            p.innerText = msg;
            messagesDiv.appendChild(p);
            // Auto-scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Allow 'Enter' key to send messages
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
